apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimirentaltestpod
  labels:
    project: mimitest
  namespace: mimi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mimirental
  template:
    metadata:
      labels:
        app: mimirental
    spec:
      containers:
        - name: mimirentaltest
          image: jahee24/mimirental:1.1
          ports:
            - containerPort: 5678
          env:
            - name: DB_HOST
              value: "mimimysql"
            - name: DB_NAME
              value: "mimi"
            - name: DB_USER
              value: "mytest"
            - name: DB_PASSWORD
              value: "1234"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://10.105.167.121:3306/mimi"
            - name: SPRING_DATASOURCE_USERNAME
              value: "mytest"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "1234"
---

apiVersion: v1
kind: Service
metadata:
  name: mimi-rental-service
  labels:
    project: mimitest
  namespace: mimi
spec:
  selector:
    app: mimirental
  type: ClusterIP
  ports:
    - port: 5678 # 노출할 서비스의 포트
      targetPort: 5678 #서비스포트와 연결할 컨테이너 포트, containerPort와 일치


